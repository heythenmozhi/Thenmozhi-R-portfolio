<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1066" width="100%" height="100%">
  <defs>
    <!-- Background Artistic Mural Gradients -->
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Artistic Mural Swatches from Original Photo -->
    <linearGradient id="tealMural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="coralMural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="limeLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="bluePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Saree Gradient: Soft Lavender Pink Silk with Luster -->
    <linearGradient id="pinkSaree" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.6"/>
      <stop offset="20%" stop-color="#fbcfe8" />
      <stop offset="55%" stop-color="#f472b6" />
      <stop offset="85%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Silver Zari Border -->
    <linearGradient id="silverZari" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Realistic Skin Tone Gradient -->
    <linearGradient id="portraitSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c68a6b" />
      <stop offset="50%" stop-color="#b67756" />
      <stop offset="100%" stop-color="#9f6040" />
    </linearGradient>

    <!-- Rich Black Hair Gradient -->
    <linearGradient id="darkHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262322" />
      <stop offset="50%" stop-color="#181514" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <filter id="softGazeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Wall -->
  <rect width="800" height="1066" fill="#0f172a" />

  <!-- Authentic Mural Background (matching the colorful wall in Thenmozhi's photo) -->
  <g opacity="0.95">
    <!-- Top Warm Orange / Coral Sunburst Splash -->
    <path d="M 120,-40 Q 380,40 460,-60 L 520,120 Q 300,160 120,40 Z" fill="url(#coralMural)" opacity="0.85" />
    <circle cx="340" cy="40" r="160" fill="#f97316" opacity="0.35" />

    <!-- Left Floral Petals & Teal Foliage -->
    <path d="M -80,180 C 140,160 220,380 40,560 C -40,640 -120,680 -120,400 Z" fill="url(#bluePetal)" opacity="0.8" />
    <path d="M 0,260 C 180,240 260,420 120,600 C 60,660 -40,700 -60,480 Z" fill="url(#tealMural)" opacity="0.9" />
    <path d="M 30,340 Q 140,460 20,620" fill="none" stroke="#38bdf8" stroke-width="14" opacity="0.6" stroke-linecap="round" />

    <!-- Top Right Green Foliage / Leaves -->
    <path d="M 540,-80 L 760,260 L 640,320 L 480,20 Z" fill="url(#limeLeaf)" opacity="0.85" />
    <path d="M 620,60 L 880,220 L 780,320 L 580,160 Z" fill="#65a30d" opacity="0.75" />
    <path d="M 520,180 C 680,220 820,340 760,540 L 660,520 C 640,380 560,280 520,180 Z" fill="url(#bluePetal)" opacity="0.7" />

    <!-- Lower Background Vibrant Color Field -->
    <path d="M -40,680 C 120,600 240,780 40,960 Z" fill="#e11d48" opacity="0.35" />
  </g>

  <!-- Ambient Vignette -->
  <radialGradient id="vignette" cx="50%" cy="45%" r="60%">
    <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
    <stop offset="100%" stop-color="#020617" stop-opacity="0.6" />
  </radialGradient>
  <rect width="800" height="1066" fill="url(#vignette)" />

  <!-- Portrait Silhouette & Subject: THENMOZHI R -->
  <g filter="url(#softGazeShadow)">
    
    <!-- Long Wavy Black Hair (Back & Left Flow) -->
    <path d="M 230,360 C 170,420 150,560 170,720 C 185,780 230,840 270,860 L 530,860 C 580,820 620,740 625,640 C 630,520 600,400 560,340 C 520,240 450,190 380,190 C 310,190 260,250 230,360 Z" fill="url(#darkHair)" />

    <!-- Torso and Shoulders in Silk Blouse -->
    <path d="M 170,800 C 190,670 280,600 400,600 C 520,600 610,670 630,800 L 640,1066 L 160,1066 Z" fill="#042f2e" />

    <!-- Neck & Collarbone -->
    <path d="M 350,470 L 350,580 C 350,615 450,615 450,580 L 450,470 Z" fill="url(#portraitSkin)" />
    <!-- Delicate Silver Chain / Pendant -->
    <path d="M 370,550 Q 400,585 430,550" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />

    <!-- Head & Facial Contour -->
    <ellipse cx="400" cy="390" rx="105" ry="135" fill="url(#portraitSkin)" />
    <!-- Chin & Jaw refinement -->
    <path d="M 315,380 C 320,470 365,525 400,525 C 435,525 480,470 485,380 Z" fill="url(#portraitSkin)" />

    <!-- Right Ear with Silver Jhumka -->
    <ellipse cx="502" cy="395" rx="12" ry="24" fill="#b67756" />
    <!-- Silver Jhumka Earring (Right) -->
    <g transform="translate(502, 420)">
      <circle cx="0" cy="0" r="4" fill="#f8fafc" />
      <path d="M -8,10 Q 0,4 8,10 L 10,18 Q 0,22 -10,18 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="-6" cy="22" r="1.5" fill="#f8fafc" />
      <circle cx="-2" cy="23" r="1.5" fill="#f8fafc" />
      <circle cx="2" cy="23" r="1.5" fill="#f8fafc" />
      <circle cx="6" cy="22" r="1.5" fill="#f8fafc" />
    </g>

    <!-- Left Ear with Silver Jhumka -->
    <g transform="translate(306, 435)">
      <circle cx="0" cy="0" r="3.5" fill="#f8fafc" />
      <path d="M -7,8 Q 0,3 7,8 L 8,16 Q 0,20 -8,16 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
      <circle cx="-5" cy="19" r="1.3" fill="#f8fafc" />
      <circle cx="0" cy="20" r="1.3" fill="#f8fafc" />
      <circle cx="5" cy="19" r="1.3" fill="#f8fafc" />
    </g>

    <!-- Front Waves & Tucked Hair Strands -->
    <path d="M 285,280 C 330,230 460,230 505,290 C 515,340 500,430 495,460 C 480,420 480,330 435,305 C 380,275 320,300 285,340 Z" fill="#090807" />
    <!-- Hair Strand tucked by right hand -->
    <path d="M 490,320 C 510,380 520,440 500,500 C 525,440 520,360 490,320 Z" fill="#171413" />

    <!-- Soft Facial Features (Natural, Professional, Non-caricature) -->
    <!-- Eyebrows -->
    <path d="M 335,345 Q 365,335 385,345" fill="none" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 425,345 Q 445,335 475,345" fill="none" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" />

    <!-- Expressive Dark Eyes -->
    <ellipse cx="360" cy="365" rx="14" ry="9" fill="#ffffff" opacity="0.9" />
    <circle cx="361" cy="365" r="7" fill="#1c1917" />
    <circle cx="363" cy="363" r="2" fill="#ffffff" />
    <path d="M 344,363 Q 360,354 376,363" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />

    <ellipse cx="445" cy="365" rx="14" ry="9" fill="#ffffff" opacity="0.9" />
    <circle cx="444" cy="365" r="7" fill="#1c1917" />
    <circle cx="446" cy="363" r="2" fill="#ffffff" />
    <path d="M 429,363 Q 445,354 461,363" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />

    <!-- Nose Contour -->
    <path d="M 400,358 L 396,415 Q 400,422 405,421" fill="none" stroke="#8d4e2f" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 390,418 Q 400,425 412,418" fill="none" stroke="#8d4e2f" stroke-width="1.8" />

    <!-- Gentle Warm Smile (Rose Tint) -->
    <path d="M 370,455 Q 401,478 432,455" fill="#a8434a" />
    <path d="M 372,455 Q 401,466 430,455" fill="none" stroke="#7f1d1d" stroke-width="1.5" />
    <path d="M 368,454 Q 401,475 434,454" fill="none" stroke="#991b1b" stroke-width="1.8" stroke-linecap="round" />

    <!-- Elegant Right Hand raised near ear/hair (Pose in Photo) -->
    <!-- Arm coming up -->
    <path d="M 230,580 C 205,520 200,450 240,400 C 255,380 280,390 285,420 C 290,450 270,500 260,540 Z" fill="url(#portraitSkin)" />
    <!-- Silver Bangle on Wrist -->
    <path d="M 222,465 Q 235,460 252,472" fill="none" stroke="url(#silverZari)" stroke-width="7" stroke-linecap="round" />
    <!-- Fingers gently near cheek/hair -->
    <path d="M 270,395 C 280,375 295,385 288,410 Z" fill="#b67756" />
    <path d="M 260,390 C 270,368 285,378 278,405 Z" fill="#c68a6b" />

    <!-- Beautiful Silk Saree Drape (Soft Lavender Pink Silk with Delicate Silver Zari) -->
    <!-- Pallu / Pleats Draped across Bodice and Shoulder -->
    <path d="M 210,1066 C 240,860 330,680 470,610 C 580,630 630,730 645,1066 Z" fill="url(#pinkSaree)" />

    <!-- Distinct Silver Zari Border across Pallu -->
    <path d="M 255,1066 C 300,880 380,720 485,615" fill="none" stroke="url(#silverZari)" stroke-width="26" stroke-linecap="round" />
    <path d="M 255,1066 C 300,880 380,720 485,615" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="10,6" />
    
    <!-- Fine Silk Jacquard Woven Texture Overlay -->
    <path d="M 280,940 Q 420,860 560,940" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3" stroke-dasharray="6,8" />
    <path d="M 300,980 Q 440,900 580,980" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3" stroke-dasharray="6,8" />
    <path d="M 320,1020 Q 460,940 600,1020" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3" stroke-dasharray="6,8" />

    <!-- Left Arm & Silver Bangle resting in front -->
    <path d="M 420,780 C 470,800 510,830 530,880 C 470,895 410,890 370,865 Z" fill="url(#portraitSkin)" />
    <path d="M 450,815 Q 465,835 440,845" fill="none" stroke="url(#silverZari)" stroke-width="6" stroke-linecap="round" />
    <circle cx="435" cy="830" r="3" fill="#ffffff" />
  </g>

  <!-- Clean Bottom Gradient Overlay with Label -->
  <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#020617" stop-opacity="0"/>
    <stop offset="100%" stop-color="#020617" stop-opacity="0.85"/>
  </linearGradient>
  <rect y="860" width="800" height="206" fill="url(#bottomFade)" />

  <!-- Name & Professional Title Tag at bottom -->
  <text x="400" y="990" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    THENMOZHI R
  </text>
  <text x="400" y="1025" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="1.5">
    FULL STACK DEVELOPER | AI ENTHUSIAST
  </text>
</svg>
